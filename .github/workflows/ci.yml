# GitHub Actions — Complete CI Setup

This setup gives you:

* Run tests on every push
* Run PR checks
* Code coverage reports
* Slack notifications
* Email notifications
* No GitHub Variables required
* Works with Node.js projects

---

# 1. Main CI Workflow

Create:

`.github/workflows/ci.yml`

```yaml
name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test -- --coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/

      - name: Save Coverage Summary
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          cat coverage/lcov-report/index.html > /dev/null || true

```

---

# 2. PR Title + Branch Validation

Create:

`.github/workflows/pr-check.yml`

```yaml
name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title
        run: |
          TITLE="${{ github.event.pull_request.title }}"

          echo "PR Title: $TITLE"

          if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore): ]]; then
            echo "Invalid PR title"
            echo "Use format: feat: add login page"
            exit 1
          fi

      - name: Validate Branch Name
        run: |
          BRANCH="${{ github.head_ref }}"

          echo "Branch Name: $BRANCH"

          if [[ ! "$BRANCH" =~ ^(feature|fix|hotfix|release)/ ]]; then
            echo "Invalid branch name"
            echo "Use: feature/login-page"
            exit 1
          fi

```

---

# 3. Code Coverage Badge + Report

Install:

```bash
npm install --save-dev jest
```

Add in `package.json`

```json
{
  "scripts": {
    "test": "jest",
    "coverage": "jest --coverage"
  }
}
```

Jest config:

Create:

`jest.config.js`

```js
module.exports = {
  collectCoverage: true,
  coverageDirectory: 'coverage',
  coverageReporters: ['text', 'lcov', 'html'],
};
```

